name: ci

on: [pull_request, push]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        channel: ["1.85.0", stable, nightly]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.channel }}
          components: rustfmt, clippy
      - name: Install EGL and Wayland
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq libegl-dev libgles-dev libwayland-dev
      - name: Check formatting
        if: matrix.channel == 'stable'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: matrix.channel == 'stable'
        run: cargo clippy --all-targets --features "static dynamic" -- -D warnings
      - name: Check documentation
        if: matrix.channel == 'stable'
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --no-deps
          cargo doc --no-deps --all-features
      - name: Test default features
        run: cargo test
      - name: Test static and dynamic linking
        run: cargo test --features "static dynamic"
      - name: Build all targets
        run: cargo build --features "static dynamic" --all-targets
      - name: Check EGL feature levels
        run: |
          for version in 1_0 1_1 1_2 1_3 1_4 1_5; do
            for features in "$version" "static,$version" "dynamic,$version"; do
              cargo check --all-targets --no-default-features --features "$features"
            done
          done
      - name: Check caller-provided linking
        run: cargo check --all-features --all-targets
      - name: Run load-minimal
        run: cargo run --example load-minimal --no-default-features --features "dynamic 1_4"

  cross_build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [aarch64-linux-android, x86_64-pc-windows-gnu]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Windows import-library tools
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq binutils-mingw-w64-x86-64
      - run: cargo build --features dynamic --target ${{ matrix.target }}
