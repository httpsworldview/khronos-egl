[package]
name          = "khronos-egl"
version       = "6.0.0"
authors       = ["Timothée Haudebourg <author@haudebourg.net>", "Sean Kerr <sean@metatomic.io>"]
license       = "MIT OR Apache-2.0"
description   = "Rust bindings for EGL"
repository    = "https://github.com/httpsworldview/khronos-egl"
# Upstream API documentation, not documentation built from this fork.
documentation = "https://docs.rs/khronos-egl"
readme        = "README.md"
keywords      = ["egl", "gl", "khronos", "opengl"]
build         = "build.rs"
autoexamples  = false
edition       = "2021"
resolver      = "3"
rust-version  = "1.85"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["1_5"]
static = ["pkg-config"]
no-pkg-config = []
dynamic = ["libloading"]
"1_5" = ["1_4"]
"1_4" = ["1_3"]
"1_3" = ["1_2"]
"1_2" = ["1_1"]
"1_1" = ["1_0"]
"1_0" = []

[dependencies]
libloading = { version = "^0.8", optional = true }

[build-dependencies]
pkg-config = { version = "^0.3", optional = true }

[dev-dependencies]
gl = "^0.14"
wayland-client = { version = "^0.31", features = [ "system" ] }
wayland-protocols = { version = "^0.32", features = [ "client" ] }
wayland-egl = { version = "^0.32" }

[[example]]
name = "wayland-static"
required-features = ["static", "1_5"]

[[example]]
name = "wayland-dynamic"
required-features = ["dynamic", "1_5"]

[[example]]
name = "load-minimal"
required-features = ["dynamic", "1_4"]
